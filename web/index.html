  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker management for real environments & preview iframe
      if ('serviceWorker' in navigator) {
        if (window.self !== window.top) {
          // Inside preview iframe: unregister any workers to ensure live reload and fresh preview
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        } else {
          // Check if running in native Android WebView where assets are already local
          var isNativeApp = /JavanehApp|Android.*Version\/[0-9.]+\s+Chrome/i.test(navigator.userAgent) || 
                            (window.location.hostname === 'localhost' && window.location.protocol === 'https:' && !window.location.port);
          if (!isNativeApp && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('./sw.js')
                .then(function(reg) {
                  if (reg && reg.update) reg.update();
                })
                .catch(function(err) {
                  console.info('ServiceWorker notice (offline mode available via cache):', err);
                });
            });
          }
        }
      }
    </script>
  </body>
