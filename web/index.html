<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2E7D32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>جوانه | مدیریت عادات، تسک‌ها و اهداف سالانه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        background-color: #FAF9F6;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Ensure preview in iframe does not get intercepted or cached by service workers
      if ('serviceWorker' in navigator) {
        if (window.self !== window.top) {
          // Inside preview iframe: unregister any workers to ensure live reload and fresh preview
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        } else if (window.location.protocol === 'https:' || window.location.hostname === 'localhost') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then((reg) => {
                if (reg && reg.update) reg.update();
              })
              .catch(console.error);
          });
        }
      }
    </script>
  </body>
</html>
